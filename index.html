<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartExpense | Premium Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght=300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="auth-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(18, 26, 33, 0.98); backdrop-filter: blur(8px); z-index: 99999; display: flex; justify-content: center; align-items: center; font-family: 'Poppins', sans-serif;">
        <div style="background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 35px; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.5);">
            <h2 style="color: #fff; margin-bottom: 5px; font-weight: 600;"><i class="fa-solid fa-wallet" style="color: #D4AF37;"></i> SmartExpense</h2>
            <p style="color: #ccc; font-size: 13px; margin-bottom: 25px;">Silakan masuk atau daftar akun baru</p>
            
            <input type="text" id="auth-username" placeholder="Username" style="width: 100%; padding: 12px; margin: 8px 0; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: white; font-size: 14px; box-sizing: border-box; outline: none;">
            <input type="password" id="auth-password" placeholder="Password" style="width: 100%; padding: 12px; margin: 8px 0; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: white; font-size: 14px; box-sizing: border-box; outline: none;">
            
            <button onclick="handleAuth('/api/login')" style="width: 100%; background: #2ecc71; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; margin-top: 15px; transition: 0.3s;">Masuk (Login)</button>
            <button onclick="handleAuth('/api/register')" style="width: 100%; background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.4); padding: 11px; border-radius: 8px; font-weight: 500; font-size: 14px; cursor: pointer; margin-top: 10px; transition: 0.3s;">Daftar Akun (Register)</button>
            
            <div id="auth-message" style="margin-top: 15px; font-size: 13px; font-weight: 500;"></div>
        </div>
    </div>

    <script>
    async function handleAuth(endpoint) {
        const user = document.getElementById('auth-username').value.trim();
        const pass = document.getElementById('auth-password').value.trim();
        const msgArea = document.getElementById('auth-message');

        if (!user || !pass) {
            msgArea.style.color = "#ff7675";
            msgArea.innerText = "Username dan Password wajib diisi!";
            return;
        }

        try {
            const response = await fetch(endpoint, {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: `username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`
            });

            const data = await response.json();

            if (response.ok && data.status === "success") {
                if (endpoint.includes("login")) {
                    msgArea.style.color = "#2ecc71";
                    msgArea.innerText = "Login Sukses! Membuka dashboard...";
                    setTimeout(() => {
                        document.getElementById('auth-overlay').style.display = 'none';
                    }, 1000);
                } else {
                    msgArea.style.color = "#2ecc71";
                    msgArea.innerText = "Registrasi Berhasil! Silakan klik Masuk.";
                }
            } else {
                msgArea.style.color = "#ff7675";
                msgArea.innerText = endpoint.includes("login") ? "Username atau Password salah!" : "Username sudah terdaftar!";
            }
        } catch (error) {
            msgArea.style.color = "#ff7675";
            msgArea.innerText = "Gagal terhubung ke server backend Java.";
        }
    }
    </script>
    <div class="app-container">
        <header class="header">
            <div class="logo">
                <i class="fa-solid fa-wallet" style="color: var(--accent-gold);"></i> SmartExpense
            </div>
            <div class="user-profile">
                <img src="https://ui-avatars.com/api/?name=User+Alamaq&background=D4AF37&color=fff" alt="User" class="avatar">
                <span>Halo, Alamaq Team</span>
            </div>
        </header>

        <div id="alert-area" class="alert-box" style="display: none;">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span><strong>Peringatan:</strong> Saldo Anda mendekati batas limit!</span>
        </div>

        <main class="dashboard-grid">
            <div class="left-column">
                <div class="glass-card balance-card">
                    <p class="card-subtitle">Total Saldo Tersedia</p>
                    <h1 class="balance-amount">Rp 1.000.000</h1>
                    <div class="card-footer">
                        <span><i class="fa-solid fa-building-columns"></i> Dompet Utama</span>
                        <span>IDR</span>
                    </div>
                </div>

                <div class="glass-card form-card">
                    <h3><i class="fa-solid fa-plus-circle"></i> Catat Transaksi Baru</h3>
                    <form id="transaction-form">
                        <div class="input-group">
                            <label>Jenis Transaksi</label>
                            <select id="type" required>
                                <option value="income">Pemasukan (Income)</option>
                                <option value="expense">Pengeluaran (Expense)</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>Nominal (Rp)</label>
                            <input type="number" id="amount" placeholder="Contoh: 150000" required>
                        </div>
                        <div class="input-group">
                            <label>Catatan / Keterangan</label>
                            <input type="text" id="note" placeholder="Contoh: Beli Kopi" required>
                        </div>
                        <button type="submit" class="btn-primary">
                            Simpan ke Database <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </form>
                </div>
            </div>

            <div class="right-column">
                <div class="glass-card history-card">
                    <div class="history-header">
                        <h3><i class="fa-solid fa-clock-rotate-left"></i> Riwayat Transaksi</h3>
                        <button class="btn-icon"><i class="fa-solid fa-filter"></i></button>
                    </div>
                    <div class="table-responsive">
                        <table class="premium-table">
                            <thead>
                                <tr>
                                    <th>Tanggal</th>
                                    <th>Keterangan</th>
                                    <th class="text-right">Nominal</th>
                                </tr>
                            </thead>
                            <tbody id="transaction-tbody">
                                <tr>
                                    <td><span class="badge badge-income">Hari ini</span></td>
                                    <td>
                                        <strong>Gaji Freelance</strong><br>
                                        <small class="text-muted">Pemasukan</small>
                                    </td>
                                    <td class="text-right text-income">+ Rp 500.000</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
